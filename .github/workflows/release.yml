name: Build and Release IPFLIX

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
        type: string

permissions:
  contents: write

concurrency:
  group: ipflix-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Windows NSIS Installer
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npm run lint

      - name: Build production Vite bundle and Electron backend
        run: |
          npm run build
          npm run electron:build:main

      - name: Build Windows NSIS Setup EXE
        run: npx electron-builder --config electron-builder.yml --win nsis --publish never

      - name: Verify IPFlix-Windows-Setup.exe
        shell: pwsh
        run: |
          $exe = "release/IPFlix-Windows-Setup.exe"
          if (-not (Test-Path $exe)) {
            throw "Expected Windows installer not found at $exe"
          }
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          if ($bytes.Length -lt 10000000 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            throw "Invalid PE executable header or file too small ($($bytes.Length) bytes)"
          }
          $hash = (Get-FileHash -Path $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  IPFlix-Windows-Setup.exe" | Out-File -FilePath "$exe.sha256" -Encoding ascii
          $mb = [math]::Round($bytes.Length / 1MB, 2)
          Write-Host "Verified $exe ($($bytes.Length) bytes / $mb MB) SHA-256: $hash"

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipflix-windows-installer
          path: |
            release/IPFlix-Windows-Setup.exe
            release/IPFlix-Windows-Setup.exe.sha256
          if-no-files-found: error

  build-android:
    name: Android Phone & TV Release APKs
    runs-on: ubuntu-latest
    steps:
      - name: Verify Android signing secrets
        shell: bash
        env:
          HAS_KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          HAS_KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
          HAS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS != '' }}
          HAS_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD != '' }}
        run: |
          if [ "$HAS_KS" != "true" ] || [ "$HAS_KS_PASS" != "true" ] || [ "$HAS_ALIAS" != "true" ] || [ "$HAS_KEY_PASS" != "true" ]; then
            echo "::error::Missing Android signing secrets. Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD in GitHub Repository Secrets."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34 platform & build-tools
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install dependencies & build Vite bundle
        run: |
          npm install --no-audit --no-fund
          npm run lint
          npm run build

      - name: Decode release keystore to temporary directory
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ipflix-release.jks"
          chmod 600 "$RUNNER_TEMP/ipflix-release.jks"

      - name: Build and sign Phone & TV release APKs
        shell: bash
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          GRADLE_BIN: gradle
          IPFLIX_REQUIRE_SIGNING: 'true'
          IPFLIX_KEYSTORE_PATH: ${{ runner.temp }}/ipflix-release.jks
          IPFLIX_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          IPFLIX_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          IPFLIX_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          node scripts/build-android.mjs --release-only

      - name: Verify APK signatures, package IDs, and TV Leanback manifest
        shell: bash
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          PHONE_APK="release/IPFlix-Android-Phone.apk"
          TV_APK="release/IPFlix-Android-TV.apk"

          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$PHONE_APK"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$TV_APK"

          PHONE_BADGING="$("$BUILD_TOOLS/aapt2" dump badging "$PHONE_APK")"
          TV_BADGING="$("$BUILD_TOOLS/aapt2" dump badging "$TV_APK")"

          echo "$PHONE_BADGING" | grep -q "package: name='com.ipflix.app'"
          echo "$PHONE_BADGING" | grep -q "versionCode='10000'"
          echo "$PHONE_BADGING" | grep -q "versionName='1.0.0'"

          echo "$TV_BADGING" | grep -q "package: name='com.ipflix.app.tv'"
          echo "$TV_BADGING" | grep -q "versionCode='10000'"
          echo "$TV_BADGING" | grep -q "versionName='1.0.0'"
          echo "$TV_BADGING" | grep -q "LEANBACK_LAUNCHER"

          echo "Verified distinct package IDs: com.ipflix.app (Phone) & com.ipflix.app.tv (TV)"

      - name: Clean up temporary keystore
        if: always()
        shell: bash
        run: rm -f "${{ runner.temp }}/ipflix-release.jks"

      - name: Upload Android release APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ipflix-android-apks
          path: |
            release/IPFlix-Android-Phone.apk
            release/IPFlix-Android-Phone.apk.sha256
            release/IPFlix-Android-TV.apk
            release/IPFlix-Android-TV.apk.sha256
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Generate SHA-256 checksums and release manifest
        run: node scripts/generate-release-checksums.mjs

      - name: Verify all release binaries and SHA-256 sums
        shell: bash
        run: |
          cd release
          test -s IPFlix-Windows-Setup.exe
          test -s IPFlix-Android-Phone.apk
          test -s IPFlix-Android-TV.apk
          sha256sum -c SHA256SUMS.txt
          ls -lh IPFlix-Windows-Setup.exe IPFlix-Android-Phone.apk IPFlix-Android-TV.apk SHA256SUMS.txt ipflix-release.json
          cat SHA256SUMS.txt

      - name: Determine release tag
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: IPFLIX ${{ steps.meta.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## IPFLIX ${{ steps.meta.outputs.tag }}
            Resmi çoklu platform üretim sürümü.

            ### İndirme Dosyaları
            - **Windows Kurulum (NSIS Setup):** `IPFlix-Windows-Setup.exe`
            - **Android Telefon (Release APK - `com.ipflix.app`):** `IPFlix-Android-Phone.apk`
            - **Android TV (Release APK - `com.ipflix.app.tv`):** `IPFlix-Android-TV.apk`
            - **SHA-256 Doğrulama Özeti:** `SHA256SUMS.txt` ve `ipflix-release.json`
          files: |
            release/IPFlix-Windows-Setup.exe
            release/IPFlix-Windows-Setup.exe.sha256
            release/IPFlix-Android-Phone.apk
            release/IPFlix-Android-Phone.apk.sha256
            release/IPFlix-Android-TV.apk
            release/IPFlix-Android-TV.apk.sha256
            release/SHA256SUMS.txt
            release/ipflix-release.json
