      <stop offset="0%" stop-color="#171A23" />
      <stop offset="55%" stop-color="#0E1017" />
      <stop offset="100%" stop-color="#07080C" />
    </linearGradient>
    <radialGradient id="ipflix-ambient-red" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(182 256) rotate(90) scale(210 210)">
      <stop offset="0%" stop-color="#E50914" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#E50914" stop-opacity="0" />
